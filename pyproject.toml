[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawsvg-ui"
version = "0.3.0"
description = "GUI for creating drawsvg scenes with PySide6"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "UI_drawsvg maintainers" }]
dependencies = [
  "drawsvg>=2.4,<3",
  "PySide6>=6.9.2,<7",
  "PySide6-Addons>=6.9.2,<7",
  "PySide6-Essentials>=6.9.2,<7",
  "shiboken6>=6.9.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.gui-scripts]
drawsvg-ui = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
py-modules = [
  "app_info",
  "app_logging",
  "asset_service",
  "bitmap_item",
  "canvas_view",
  "clipboard_service",
  "connectors",
  "constants",
  "document_format",
  "document_controller",
  "document_io",
  "document_validator",
  "export_drawsvg",
  "export_renderer",
  "import_drawsvg",
  "layer_manager",
  "layers_panel",
  "main",
  "main_window",
  "palette",
  "png_export_dialog",
  "properties_panel",
  "property_command_service",
  "recovery",
  "ruler_widget",
  "scene_codec",
  "shape_registry",
  "style_presets",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["items*", "ui*"]

[tool.setuptools.package-data]
ui = ["*.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
