[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawsvg-ui"
version = "0.8.0"
description = "GUI for creating drawsvg scenes with PySide6"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Taron686", email = "Taron686@users.noreply.github.com" }]
license = { text = "GPL-2.0-or-later" }
keywords = ["drawsvg", "pyside6", "gui", "svg", "vector-graphics", "editor"]
dependencies = [
  "drawsvg>=2.4,<3",
  "PySide6>=6.9.2,<7",
  "PySide6-Addons>=6.9.2,<7",
  "PySide6-Essentials>=6.9.2,<7",
  "shiboken6>=6.9.2,<7",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Editors",
  "Topic :: Multimedia :: Graphics :: Viewers",
  "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/Taron686/drawsvg-ui"
Repository = "https://github.com/Taron686/drawsvg-ui"
Documentation = "https://github.com/Taron686/drawsvg-ui#readme"
"Issue Tracker" = "https://github.com/Taron686/drawsvg-ui/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]

[project.gui-scripts]
drawsvg-ui = "main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ui = ["*.ui"]

[tool.bumpversion]
current_version = "0.8.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B", "SIM", "UP"]
ignore = [
  "B008",    # Qt value objects as argument defaults
  "B905",    # zip(strict=...) needs a per-call decision
  "SIM101",  # style-only rewrites, left to the author
  "SIM102",
  "SIM105",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# Tests keep Qt objects alive through otherwise unused locals.
"tests/**" = ["F841"]
