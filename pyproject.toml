[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawsvg-ui"
version = "0.7.0"
description = "GUI for creating drawsvg scenes with PySide6"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Taron686", email = "Taron686@users.noreply.github.com" }]
license = { text = "GPL-2.0-or-later" }
keywords = ["drawsvg", "pyside6", "gui", "svg", "vector-graphics", "editor"]
dependencies = [
  "drawsvg>=2.4,<3",
  "PySide6>=6.9.2,<7",
  "PySide6-Addons>=6.9.2,<7",
  "PySide6-Essentials>=6.9.2,<7",
  "shiboken6>=6.9.2,<7",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Editors",
  "Topic :: Multimedia :: Graphics :: Viewers",
  "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/Taron686/drawsvg-ui"
Repository = "https://github.com/Taron686/drawsvg-ui"
Documentation = "https://github.com/Taron686/drawsvg-ui#readme"
"Issue Tracker" = "https://github.com/Taron686/drawsvg-ui/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]

[project.gui-scripts]
drawsvg-ui = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
py-modules = [
  "app_info",
  "app_logging",
  "asset_service",
  "bitmap_item",
  "canvas_view",
  "clipboard_service",
  "connectors",
  "constants",
  "document_controller",
  "document_format",
  "document_io",
  "document_validator",
  "export_drawsvg",
  "export_renderer",
  "hover_preview",
  "import_drawsvg",
  "layer_manager",
  "layers_panel",
  "main",
  "main_window",
  "palette",
  "png_export_dialog",
  "properties_panel",
  "property_command_service",
  "recovery",
  "ruler_widget",
  "scene_codec",
  "shape_registry",
  "style_presets",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["items*", "ui*"]

[tool.setuptools.package-data]
ui = ["*.ui"]

[tool.bumpversion]
current_version = "0.7.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
